# Render Blueprint — https://render.com/docs/blueprint-spec
# Free web service. The SQLite file lives on the instance's ephemeral disk, so the
# demo data is re-created (migrated + seeded) whenever the instance restarts.
services:
  - type: web
    runtime: node
    name: paidpath
    plan: free
    region: oregon
    branch: main
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_PATH
        value: ./data/paidpath.db
      - key: PAYPAL_ENVIRONMENT
        value: SANDBOX
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_SANDBOX_BUYER_EMAIL
        sync: false
      - key: GOOGLE_GENERATIVE_AI_API_KEY
        sync: false
